<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 260px;
      padding: 16px;
      background: #ffffff;
      color: #1a1a1a;
    }

    .header {
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header p {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      background: #fafafa;
      margin-bottom: 12px;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: #666;
    }

    button {
      width: 100%;
      padding: 8px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    button:hover { background: #333; }

    #status {
      text-align: center;
      font-size: 11px;
      color: #2e7d32;
      margin-top: 8px;
      min-height: 14px;
    }

    .footer-links {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .footer-links a {
      color: #888;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .footer-links a svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .footer-links a:hover { color: #1a1a1a; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Lipi</h1>
    <p>Set your paste font</p>
  </div>

  <label>Font Family</label>
  <select id="fontFamily">
    <option value="">Detecting fonts...</option>
  </select>

  <button id="save">Save</button>
  <div id="status"></div>
